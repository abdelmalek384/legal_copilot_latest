.research-conversation{display:block;width:100%;text-align:start;background:transparent;color:var(--tx);border:1px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:4px 0}.research-conversation.active{background:var(--pri-l);color:var(--pri);border-color:#B8CCFA}.research-main{min-width:0}.research-thread{min-height:48vh;max-height:62vh;overflow:auto}.research-heading{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}.research-empty{text-align:center;padding:48px 12px;color:var(--mut)}.research-message{max-width:94%;padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere}.research-message.user{margin-inline-start:auto;background:var(--pri-l);border-color:#D6E3FF}.research-role,.research-sources-title{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:5px}.research-content{white-space:pre-wrap}.research-source p{white-space:pre-wrap;overflow-wrap:anywhere}.research-composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}

.research-trust-status[hidden]{display:none}
.research-corpus-status .mut{font-size:11px}

/* Workspace refresh: clearer hierarchy, calm surfaces, stronger focus and mobile behavior. */
:root{--navy:#14284B;--bg:#F5F7FB;--line:#E5EAF2;--tx:#182230;--mut:#5F6B7C;--pri:#2457C5;--pri-l:#EAF1FF;--ok:#166534;--ok-l:#E8F7EF;--warn:#A95B08;--warn-l:#FFF4E4;--bad:#B42318;--bad-l:#FDECEC}
body{background:var(--bg);font-family:Inter,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.65}
#shell{min-height:100vh;gap:0}
#side{width:248px;background:#fff;color:var(--tx);padding:20px 14px;border-inline-end:1px solid var(--line);gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
#side h1{font-size:16px;color:var(--navy);padding:12px 10px;margin:0 0 12px;border-bottom:1px solid var(--line);line-height:1.5}
#side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#526176;font-weight:600;transition:background .15s,color .15s}
#side a:before{content:"";width:5px;height:5px;border-radius:50%;background:#B8C4D6;flex:none}
#side a.on,#side a:hover{background:var(--pri-l);color:var(--pri)}
#side a.on:before{background:var(--pri);width:6px;height:18px;border-radius:4px}
#side .lang-switch{margin:2px 0 10px}
#side .lang-switch button{width:100%;background:#fff;color:var(--mut);border:1px solid var(--line)}
#side .me{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);color:var(--tx);overflow-wrap:anywhere}
#side .me a{margin-top:8px;color:var(--mut);font-size:13px}
#main{flex:1;max-width:none;min-width:0;padding:28px clamp(16px,3vw,40px)}
#main>h2{font-size:26px;line-height:1.3;letter-spacing:-.4px;margin:0 0 22px;color:#14284B}
.card{border-color:var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #172b4d05;margin-bottom:16px}
.grid,.cols{gap:16px}
.stat{position:relative;overflow:hidden;min-height:116px;padding:20px}
.stat b{font-size:32px;letter-spacing:-.7px;color:var(--navy)}
.stat span{display:block;margin-top:3px;line-height:1.45}
button,input,select,textarea{border-radius:9px;transition:border-color .15s,box-shadow .15s}
input,select,textarea{border-color:var(--ui-control-border);min-height:40px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2457C5;outline-offset:2px;border-color:var(--pri)}
button{font-weight:650;padding:9px 14px}
button.g{color:#344256}
.row{padding:12px 0;gap:12px}
.pill{padding:3px 10px;line-height:1.5}
#main .workspace-subtitle{margin-top:-14px;margin-bottom:20px;color:var(--mut)}
#main .workspace-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
#main .workspace-hero{background:linear-gradient(115deg,#14284B,#234A86);color:#fff;border:0;padding:24px}
#main .workspace-hero h3{font-size:21px;margin:0 0 4px}
#main .workspace-hero p{color:#D9E5F7;margin:0 0 16px}
#main .workspace-hero button.g{background:#fff;color:#18345F;border-color:#fff}
#main .workspace-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 10px}
#main .workspace-section-title h3{margin:0}
#main .quick-link{display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:5px;padding:14px;background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:12px;min-height:90px}
#main .quick-link b{color:var(--navy)}
#main .quick-link span{font-size:12px;color:var(--mut);font-weight:400}
#main .workspace-list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
#main .workspace-list-item:last-child{border-bottom:0}
#main .workspace-list-item .item-main{min-width:0;flex:1}
#main .workspace-list-item .item-main b{display:block;overflow-wrap:anywhere}
#main .workspace-list-item .item-meta{font-size:12px;color:var(--mut)}
#main .filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
#main .filter-bar input{flex:1;min-width:220px}
#main .filter-bar select{min-width:130px}
.research-layout{gap:16px}
.research-list,.research-thread{border-radius:14px}
.research-thread{background:#FBFCFE}
.research-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:0 0 12px}
.research-controls label{display:grid;gap:5px;min-width:0;font-size:12px;color:var(--mut);font-weight:700}
.research-scope-tabs{display:flex;grid-column:1/-1;gap:4px;padding:4px;background:var(--workspace-blue-soft);border-radius:12px;min-width:0}
.research-scope-tab{flex:1;min-width:0;min-height:40px;padding:8px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--workspace-ink);font-weight:700;font-size:13px;white-space:normal}
.research-scope-tab.active,.research-scope-tab[aria-pressed="true"]{background:#fff;border-color:var(--workspace-border);box-shadow:0 2px 8px rgba(23,36,58,.07);color:var(--workspace-blue)}
.research-scope-tab:focus-visible{outline:3px solid var(--ui-focus);outline-offset:2px}

.research-controls select{width:100%;min-width:0;min-height:40px}
.research-source-actions,.research-message-actions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.research-source-actions button,.research-message-actions button{min-height:34px;font-size:12px}
.research-pin{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.research-exact-passage{border-inline-start:3px solid var(--pri);padding:8px 12px;margin:8px 0;background:#F3F6FB;white-space:pre-wrap;overflow-wrap:anywhere}
.research-status{display:inline-block;margin:4px 0}
.research-discovery-result{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;background:#fff}
@media(max-width:560px){.research-controls{grid-template-columns:minmax(0,1fr)}}
.research-heading{position:sticky;top:0;background:#FBFCFE;z-index:2;padding-top:8px}
.research-composer textarea{border-color:#D8E0EB;background:#fff}
@media(max-width:800px){
 #shell{flex-direction:column}
 #side{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;padding:8px;gap:5px;border-inline-end:0;border-bottom:1px solid var(--line)}
 #side h1{display:none}
 #side .lang-switch{margin:0;min-width:88px}
 #side .lang-switch button{padding:7px 9px}
 #side>a{white-space:nowrap;padding:9px 11px;font-size:13px}
 #side>a:before{display:none}
 #side .me{display:none}
 #main{padding:18px 12px}
 #main>h2{font-size:22px;margin-bottom:18px}
 #main .workspace-hero{padding:18px}
 #main .workspace-list-item{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* UI refresh conflict resolution: accessible controls and resilient narrow layouts. */
:root{--ui-focus:#80a7ff}
:where(button,input,select,textarea,a,[tabindex]):focus-visible{outline:3px solid var(--ui-focus);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:#7295ed;box-shadow:0 0 0 3px #2856c71a}
button{min-height:40px}
@media(max-width:800px){#shell{min-width:0}#main{min-width:0;width:100%}img,svg,canvas,video{max-width:100%}}
@media(max-width:420px){#main{padding-inline:10px}.card{padding:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.skip-link{position:fixed;top:8px;inset-inline-start:8px;z-index:2001;transform:translateY(-160%);padding:10px 14px;background:#fff;color:var(--navy);border:2px solid var(--pri);border-radius:9px;box-shadow:0 4px 18px #14284b24;font-weight:700}
.skip-link:focus{transform:translateY(0)}
#side a[role=button]{display:flex;align-items:center;min-height:42px;text-decoration:none}
#side a[role=button]:focus-visible{outline:3px solid #80a7ff;outline-offset:2px}
#main:focus{outline:3px solid var(--ui-focus);outline-offset:2px}
@media(max-width:800px){.skip-link{top:6px}#side a[role=button]{white-space:nowrap;flex:none}}
@media(forced-colors:active){.skip-link:focus,#side a[role=button]:focus-visible,#main:focus{outline:2px solid Highlight;outline-offset:2px}}


/* Small-screen and long-content resilience pass from usability review. */
.auth-card form>label{display:block;margin:10px 0 4px;line-height:1.5;overflow-wrap:anywhere}
.auth-card .password-row{min-width:0}
.auth-card .password-row button{flex:0 0 auto;white-space:nowrap}
#side{min-width:0}
.card,.stat,.quick-link,.workspace-list-item,.workspace-list-item .item-main{min-width:0}
.stat b{font-size:clamp(22px,2.5vw,32px);line-height:1.25;overflow-wrap:anywhere}
#main .quick-link span,#main .workspace-list-item .item-meta,.research-role,.research-sources-title,.research-pin{font-size:13px}
@media(max-width:800px){
 #side{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
 #side>a{flex:0 0 auto;white-space:nowrap}
 #main .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
}
@media(max-width:420px){
 .auth-card{padding:18px}
 .auth-tabs button{min-width:0;overflow-wrap:anywhere}
 .stat b{font-size:26px}
}

/* Pilot phone-readability contract: body copy and every interactive target stay legible/tappable. */
.research-role,.research-sources-title,.research-pin,#main .quick-link span,#main .workspace-list-item .item-meta,.research-controls label,.research-source-actions button,.research-message-actions button,#side .me,#side .me a,.pill{font-size:14px}
button{min-height:44px}
.auth-card form>label{display:block;width:100%;margin:12px 0 5px;line-height:1.5;overflow-wrap:anywhere}
.auth-card .password-row{display:flex;width:100%;min-width:0;align-items:stretch}
.auth-card .password-row input{min-width:0;flex:1}
.auth-card .password-row button{min-height:44px;flex:0 0 auto}
.tabs a{min-height:44px;display:flex;align-items:center}
.nav-scroll-hint{display:none}
#side a[role=button]{min-height:44px}
@media(max-width:800px){
 #side nav:after{background:linear-gradient(90deg,transparent,#fff)}

/* Final interaction and data-density pass: consistent controls across every workspace. */
:root {
  --ui-focus-ring: #2457c5;
  --ui-control-border: #8292a8;
  --ui-control-hover: #7c8da3;
}
:where(input,select,textarea) {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  color: var(--ui-ink);
  background: var(--ui-surface);
  border: 1px solid var(--ui-control-border);
  border-radius: 10px;
  padding: 10px 12px;
  line-height: 1.5;
}
:where(input,select,textarea):hover:not(:disabled) { border-color: var(--ui-control-hover); }
:where(input,select,textarea):focus-visible,
:where(button,a,[role="button"],[tabindex]):focus-visible {
  outline: 3px solid var(--ui-focus-ring);
  outline-offset: 2px;
}
:where(button) {
  min-height: 44px;
  border-radius: 10px;
  transition: background-color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease;
}
:where(button):hover:not(:disabled) { filter: brightness(.97); }
:where(button):active:not(:disabled) { transform: translateY(1px); }
:where(button):disabled,
:where(input,select,textarea):disabled {
  opacity: .58;
  cursor: not-allowed;
}
:where(a) { text-underline-offset: 3px; }
:where(table) {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 14px;
}
:where(th,td) {
  padding: 11px 12px;
  border-bottom: 1px solid var(--ui-border);
  text-align: start;
  vertical-align: top;
}
:where(th) {
  color: #42536c;
  background: #f7f9fc;
  font-weight: 750;
  white-space: nowrap;
}
:where(tr:last-child td) { border-bottom: 0; }
:where(pre,code) { overflow-wrap: anywhere; }
:where(.card,.modal,.research-discovery-result,.research-message) {
  overflow-wrap: anywhere;
}
:where(.modal-backdrop) { overscroll-behavior: contain; }
:where(.modal) {
  border: 1px solid var(--ui-border);
  border-radius: 18px;
  box-shadow: 0 24px 70px rgba(15,30,55,.24);
  background: var(--ui-surface);
  padding: clamp(16px,3vw,26px);
}
:where(.research-composer) {
  position: sticky;
  bottom: 0;
  z-index: 3;
  padding: 12px;
  margin-top: 12px;
  border: 1px solid var(--ui-border);
  border-radius: 14px;
  background: rgba(255,255,255,.97);
  box-shadow: 0 -6px 24px rgba(20,40,75,.06);
  backdrop-filter: blur(12px);
}
:where(.research-composer textarea) { min-height: 88px; }
:where(.research-thread) { scroll-behavior: smooth; scrollbar-gutter: stable; }
:where(.research-list,.research-thread) { overscroll-behavior: contain; }
:where(.workspace-list-item,.row) { min-width: 0; }
:where(.pill) { white-space: normal; }
@media(max-width:800px) {
  :where(table) { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  :where(.research-composer) { position: static; }
  :where(.research-thread) { scroll-behavior: auto; }
}
@media(max-width:420px) {
  :where(input,select,textarea) { font-size: 16px; }
  :where(.modal) { border-radius: 14px; }
  :where(th,td) { padding: 9px 10px; }
}
@media(forced-colors:active) {
  :where(button,input,select,textarea,a):focus-visible { outline: 2px solid Highlight; }
  #side nav button.on { border: 1px solid Highlight; }
  :where(.card,.modal,.research-message,.research-discovery-result) { border: 1px solid CanvasText; }
}
@media(max-width:800px) {
  #side .primary-nav button { width:auto; min-width:max-content; flex:0 0 auto; white-space:nowrap; }
}
@media(prefers-reduced-motion:reduce) {
  :where(*),:where(*::before),:where(*::after) {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}

#main .document-library-list{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin:0}
#main .document-library-item{display:grid!important;grid-template-columns:minmax(230px,1.6fr) minmax(100px,.8fr) minmax(120px,1fr) minmax(130px,1fr) minmax(120px,.9fr);gap:14px;align-items:center;padding:13px 14px!important;border:0!important;border-bottom:1px solid #edf1f5!important;border-radius:0!important;background:#fff!important;box-shadow:none!important;min-width:0}
#main .document-library-item:hover{background:#fbfdff!important}
#main .document-library-file{min-width:0;align-items:center}
#main .document-library-file>div{min-width:0}
#main .document-library-file b{display:block;overflow-wrap:anywhere;color:#314a67;font-size:12px}
#main .document-library-file-icon{width:34px;height:38px;flex-basis:34px;border-radius:7px;background:#fff0f0;color:#c55c5c}
#main .document-library-cell{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;font-size:11px}
#main .document-library-cell small{font-size:10px}
#main .document-reviewer-cell{flex-wrap:nowrap;color:#50627a}
#main .document-reviewer-avatar{width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;border-radius:50%;background:#e6eef8;color:#365c88;font-weight:700;font-size:10px}
#main .document-library-item .document-library-file .g{min-height:26px;padding:3px 8px;font-size:10px}
@media(max-width:1050px){#main .document-library-table-head,#main .document-library-item{grid-template-columns:minmax(180px,1.5fr) minmax(90px,.8fr) minmax(110px,1fr) minmax(110px,1fr)}#main .document-library-table-head>*:last-child{display:none}#main .document-library-item>.document-reviewer-cell{display:none}}
@media(max-width:760px){#main .document-library-table-head{display:none}#main .document-library-item{grid-template-columns:minmax(0,1fr)!important;gap:9px;padding:13px!important}#main .document-library-cell{padding-inline-start:44px}}

#main .research-page-actions{display:flex;justify-content:flex-end;gap:8px;margin:-5px 0 14px}
#main .research-page-actions button{min-height:36px;padding:7px 13px;font-size:11px;border-radius:7px}
#main .research-page-actions button.primary{background:#1d5eaa;border-color:#1d5eaa}
#main .research-evidence-heading{font-size:12px;color:#334b67}
#main .research-evidence-heading .mut{font-size:10px}
@media(max-width:600px){#main .research-page-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}#main .research-page-actions button.primary{grid-column:1/-1}}

#main .calendar-view-switch{display:flex;gap:4px;margin-inline-start:auto;padding:3px;border:1px solid #e5ebf2;border-radius:8px;background:#f8fafc}
#main .calendar-view-switch button{min-height:29px;padding:4px 10px;border:0;background:transparent;color:#64748b;font-size:10px}
#main .calendar-view-switch button.active{background:#fff;color:#1f5fae;box-shadow:0 1px 4px rgba(20,40,70,.12)}
#main .calendar-filters{grid-template-columns:minmax(0,1.5fr) minmax(150px,.8fr) minmax(150px,.8fr)}
#main .calendar-agenda-mode{position:static;max-height:none}
@media(max-width:760px){#main .calendar-filters{grid-template-columns:minmax(0,1fr)}#main .calendar-view-switch{margin-inline-start:0}}

#main .document-library-view-tabs{display:flex;align-items:center;gap:20px;padding:0 14px;border-bottom:1px solid #e8edf3;background:#fff}
#main .document-library-view-tabs button{position:relative;border:0;border-radius:0;background:transparent;color:#7b899b;padding:13px 3px;font-size:11px}
#main .document-library-view-tabs button.active{color:#1f5fae;font-weight:700}
#main .document-library-view-tabs button.active:after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:#1f5fae}
#main .document-library-view-tabs button:focus-visible{outline:2px solid #6ea6df;outline-offset:2px}

   await api('/cases/'+caseId+'/docs/'+item.doc.document_id+'/chunks/'+chunk.id+'/review','POST',payload);

const EN_AR=Object.fromEntries(Object.entries(AR_EN).map(([a,e])=>[e,a]));
function tr(v){if(!v)return v;if(LANG==='en'&&v.startsWith('مرحبا '))return 'Welcome '+v.slice('مرحبا '.length);if(LANG==='ar'&&v.startsWith('Welcome '))return 'مرحبا '+v.slice('Welcome '.length);const dict=LANG==='en'?AR_EN:EN_AR;return dict[v]||v}
function applyLanguage(root=document.body){
 document.documentElement.lang=LANG==='ar'?'ar':'en';document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
 document.body.style.direction=LANG==='ar'?'rtl':'ltr';document.title=LANG==='ar'?'المساعد القانوني':'Legal Copilot';
 const walk=n=>{if(n.nodeType===Node.TEXT_NODE){const v=n.nodeValue.trim();if(v&&tr(v)!==v)n.nodeValue=n.nodeValue.replace(v,tr(v))}
 else if(n.nodeType===Node.ELEMENT_NODE){if(n.hasAttribute('placeholder'))n.setAttribute('placeholder',tr(n.getAttribute('placeholder')));if(n.hasAttribute('aria-label'))n.setAttribute('aria-label',tr(n.getAttribute('aria-label')));for(const c of [...n.childNodes])walk(c)}};
 walk(root);
 const languageLabel=LANG==='ar'?'English':'العربية';
 document.querySelectorAll('[data-lang-switch]').forEach(b=>{if(b.textContent!==languageLabel)b.textContent=languageLabel});
}
function switchLanguage(){LANG=LANG==='ar'?'en':'ar';sessionStorage.lang=LANG;if(!ME.id){login(AUTH_MODE);setTimeout(()=>applyLanguage(),0);return}if(PAGE==='documents')documentsPage();else if(window.CASE_ID){view(window.CASE_ID)}else if(PAGE==='dash')dash();else if(PAGE==='clients')clients();else if(PAGE==='cases')casesPage();else if(PAGE==='tasks')tasksPage();else if(PAGE==='calendar')calendarPage();else if(PAGE==='law')law();else if(PAGE==='coverage')corpusCoverage();else if(PAGE==='review')reviewWorkbench();else if(PAGE==='settings')settingsPage();else if(PAGE==='setup')firstRunPage();else if(PAGE==='setup-health')setupHealthPage();else dash();setTimeout(()=>applyLanguage(),0)}
document.addEventListener('keydown',e=>{
 const overlays=document.querySelectorAll('.modal-backdrop'),overlay=overlays[overlays.length-1];
 if(!overlay)return;
 if(e.key==='Escape'){closeModal(overlay);return}
 if(e.key!=='Tab')return;
 const focusables=Array.from(overlay.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(el=>el.getClientRects().length>0&&el.getAttribute('aria-hidden')!=='true');
 if(!focusables.length){e.preventDefault();return}
 const first=focusables[0],last=focusables[focusables.length-1];
 if(e.shiftKey&&(document.activeElement===first||!overlay.contains(document.activeElement))){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&(document.activeElement===last||!overlay.contains(document.activeElement))){e.preventDefault();first.focus()}
});
const languageObserver=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===Node.ELEMENT_NODE||n.nodeType===Node.TEXT_NODE)applyLanguage(n.nodeType===Node.ELEMENT_NODE?n:n.parentElement||document.body)});
languageObserver.observe(document.body,{childList:true,subtree:true});
