/* Workspace refresh: clearer hierarchy, calm surfaces, stronger focus and mobile behavior. */
:root{--navy:#14284B;--bg:#F5F7FB;--line:#E5EAF2;--tx:#182230;--mut:#64748B;--pri:#2457C5;--pri-l:#EAF1FF;--ok:#16804A;--ok-l:#E8F7EF;--warn:#A95B08;--warn-l:#FFF4E4;--bad:#B42318;--bad-l:#FDECEC}
body{background:var(--bg);font-family:Inter,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.65}
#shell{min-height:100vh;gap:0}
#side{width:248px;background:#fff;color:var(--tx);padding:20px 14px;border-inline-end:1px solid var(--line);gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
#side h1{font-size:16px;color:var(--navy);padding:12px 10px;margin:0 0 12px;border-bottom:1px solid var(--line);line-height:1.5}
#side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#526176;font-weight:600;transition:background .15s,color .15s}
#side a:before{content:"";width:5px;height:5px;border-radius:50%;background:#B8C4D6;flex:none}
#side a.on,#side a:hover{background:var(--pri-l);color:var(--pri)}
#side a.on:before{background:var(--pri);width:6px;height:18px;border-radius:4px}
#side .lang-switch{margin:2px 0 10px}
#side .lang-switch button{width:100%;background:#fff;color:var(--mut);border:1px solid var(--line)}
#side .me{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);color:var(--tx);overflow-wrap:anywhere}
#side .me a{margin-top:8px;color:var(--mut);font-size:13px}
#main{flex:1;max-width:none;min-width:0;padding:28px clamp(16px,3vw,40px)}
#main>h2{font-size:26px;line-height:1.3;letter-spacing:-.4px;margin:0 0 22px;color:#14284B}
.card{border-color:var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #172b4d05;margin-bottom:16px}
.grid,.cols{gap:16px}
.stat{position:relative;overflow:hidden;min-height:116px;padding:20px}
.stat b{font-size:32px;letter-spacing:-.7px;color:var(--navy)}
.stat span{display:block;margin-top:3px;line-height:1.45}
button,input,select,textarea{border-radius:9px;transition:border-color .15s,box-shadow .15s}
input,select,textarea{border-color:#D8E0EB;min-height:40px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #2457C533;outline-offset:2px;border-color:var(--pri)}
button{font-weight:650;padding:9px 14px}
button.g{color:#344256}
.row{padding:12px 0;gap:12px}
.pill{padding:3px 10px;line-height:1.5}
#main .workspace-subtitle{margin-top:-14px;margin-bottom:20px;color:var(--mut)}
#main .workspace-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
#main .workspace-hero{background:linear-gradient(115deg,#14284B,#234A86);color:#fff;border:0;padding:24px}
#main .workspace-hero h3{font-size:21px;margin:0 0 4px}
#main .workspace-hero p{color:#D9E5F7;margin:0 0 16px}
#main .workspace-hero button.g{background:#fff;color:#18345F;border-color:#fff}
#main .workspace-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 10px}
#main .workspace-section-title h3{margin:0}
#main .quick-link{display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:5px;padding:14px;background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:12px;min-height:90px}
#main .quick-link b{color:var(--navy)}
#main .quick-link span{font-size:12px;color:var(--mut);font-weight:400}
#main .workspace-list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
#main .workspace-list-item:last-child{border-bottom:0}
#main .workspace-list-item .item-main{min-width:0;flex:1}
#main .workspace-list-item .item-main b{display:block;overflow-wrap:anywhere}
#main .workspace-list-item .item-meta{font-size:12px;color:var(--mut)}
#main .filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
#main .filter-bar input{flex:1;min-width:220px}
#main .filter-bar select{min-width:130px}
.research-layout{gap:16px}
.research-list,.research-thread{border-radius:14px}
.research-thread{background:#FBFCFE}
.research-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:0 0 12px}
.research-controls label{display:grid;gap:5px;min-width:0;font-size:12px;color:var(--mut);font-weight:700}
.research-controls select{width:100%;min-width:0;min-height:40px}
.research-source-actions,.research-message-actions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.research-source-actions button,.research-message-actions button{min-height:34px;font-size:12px}
.research-pin{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.research-exact-passage{border-inline-start:3px solid var(--pri);padding:8px 12px;margin:8px 0;background:#F3F6FB;white-space:pre-wrap;overflow-wrap:anywhere}
.research-status{display:inline-block;margin:4px 0}
.research-discovery-result{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;background:#fff}
@media(max-width:560px){.research-controls{grid-template-columns:minmax(0,1fr)}}
.research-heading{position:sticky;top:0;background:#FBFCFE;z-index:2;padding-top:8px}
.research-composer textarea{border-color:#D8E0EB;background:#fff}
@media(max-width:800px){
 #shell{flex-direction:column}
 #side{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;padding:8px;gap:5px;border-inline-end:0;border-bottom:1px solid var(--line)}
 #side h1{display:none}
 #side .lang-switch{margin:0;min-width:88px}
 #side .lang-switch button{padding:7px 9px}
 #side>a{white-space:nowrap;padding:9px 11px;font-size:13px}
 #side>a:before{display:none}
 #side .me{display:none}
 #main{padding:18px 12px}
 #main>h2{font-size:22px;margin-bottom:18px}
 #main .workspace-hero{padding:18px}
 #main .workspace-list-item{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

/* UI refresh conflict resolution: accessible controls and resilient narrow layouts. */
:root{--ui-focus:#80a7ff}
:where(button,input,select,textarea,a,[tabindex]):focus-visible{outline:3px solid var(--ui-focus);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:#7295ed;box-shadow:0 0 0 3px #2856c71a}
button{min-height:40px}
@media(max-width:800px){#shell{min-width:0}#main{min-width:0;width:100%}img,svg,canvas,video{max-width:100%}}
@media(max-width:420px){#main{padding-inline:10px}.card{padding:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.skip-link{position:fixed;top:8px;inset-inline-start:8px;z-index:2001;transform:translateY(-160%);padding:10px 14px;background:#fff;color:var(--navy);border:2px solid var(--pri);border-radius:9px;box-shadow:0 4px 18px #14284b24;font-weight:700}
.skip-link:focus{transform:translateY(0)}
#side a[role=button]{display:flex;align-items:center;min-height:42px;text-decoration:none}
#side a[role=button]:focus-visible{outline:3px solid #80a7ff;outline-offset:2px}
#main:focus{outline:none}
@media(max-width:800px){.skip-link{top:6px}#side a[role=button]{white-space:nowrap;flex:none}}
@media(forced-colors:active){.skip-link:focus,#side a[role=button]:focus-visible{outline:2px solid Highlight}}

const EN_AR=Object.fromEntries(Object.entries(AR_EN).map(([a,e])=>[e,a]));
function tr(v){if(!v)return v;if(LANG==='en'&&v.startsWith('مرحبا '))return 'Welcome '+v.slice('مرحبا '.length);if(LANG==='ar'&&v.startsWith('Welcome '))return 'مرحبا '+v.slice('Welcome '.length);const dict=LANG==='en'?AR_EN:EN_AR;return dict[v]||v}
function applyLanguage(root=document.body){
 document.documentElement.lang=LANG==='ar'?'ar':'en';document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
 document.body.style.direction=LANG==='ar'?'rtl':'ltr';document.title=LANG==='ar'?'المساعد القانوني':'Legal Copilot';
 const walk=n=>{if(n.nodeType===Node.TEXT_NODE){const v=n.nodeValue.trim();if(v&&tr(v)!==v)n.nodeValue=n.nodeValue.replace(v,tr(v))}
 else if(n.nodeType===Node.ELEMENT_NODE){if(n.hasAttribute('placeholder'))n.setAttribute('placeholder',tr(n.getAttribute('placeholder')));if(n.hasAttribute('aria-label'))n.setAttribute('aria-label',tr(n.getAttribute('aria-label')));for(const c of [...n.childNodes])walk(c)}};
 walk(root);
 document.querySelectorAll('[data-lang-switch]').forEach(b=>b.textContent=LANG==='ar'?'English':'العربية');
}
function switchLanguage(){LANG=LANG==='ar'?'en':'ar';sessionStorage.lang=LANG;if(!ME.id){login(AUTH_MODE);setTimeout(()=>applyLanguage(),0);return}if(window.CASE_ID){view(window.CASE_ID)}else if(PAGE==='dash')dash();else if(PAGE==='clients')clients();else if(PAGE==='cases')casesPage();else if(PAGE==='tasks')tasksPage();else if(PAGE==='calendar')calendarPage();else if(PAGE==='law')law();else if(PAGE==='coverage')corpusCoverage();else if(PAGE==='review')reviewWorkbench();else if(PAGE==='settings')settingsPage();else dash();setTimeout(()=>applyLanguage(),0)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const overlays=document.querySelectorAll('.modal-backdrop');const overlay=overlays[overlays.length-1];if(overlay)overlay.remove()}});
const languageObserver=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===Node.ELEMENT_NODE||n.nodeType===Node.TEXT_NODE)applyLanguage(n.nodeType===Node.ELEMENT_NODE?n:n.parentElement||document.body)});
languageObserver.observe(document.body,{childList:true,subtree:true});
applyLanguage();api('/session').then(r=>{ME={id:r.id,name:r.name,role:r.role};sessionStorage.me=JSON.stringify(ME);dash()}).catch(()=>login())
