name: Pilot stabilization regression

on:
  pull_request:
    branches: ['pilot/**']

permissions:
  contents: read

concurrency:
  group: pilot-stabilization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COPILOT_ENV: development
      LEGAL_QUALIFIED_EGYPTIAN_COUNSEL_USER_IDS: "42"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install hash-locked dependencies
        id: install_locked_dependencies
        run: python -m pip install --require-hashes -r requirements-py312.lock
      - name: Test subscription, invitation and read-only billing lifecycle
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_subscription_billing_routes.py
      - name: Test case fee and invoice payment authorization
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_invoice_payment_routes.py
      - name: Test identity invitations, recovery, rate limits and session revocation
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_identity_lifecycle.py
      - name: Test encrypted multi-database backup and restore
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_database_backup_bundle.py
      - name: Test encrypted S3 recovery archive transport
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_database_backup_archive.py
      - name: Test isolated database recovery drill
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_database_recovery_drill.py
      - name: Test S3 original-file storage adapter
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_s3_original_file_storage.py
      - name: Test separate-database deployment preflight
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_deployment_preflight.py
      - name: Test tenant route inventory completeness
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_tenant_route_inventory_coverage.py
      - name: Test route authentication inventory
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_route_auth_audit.py
      - name: Test frontend Arabic/English UX contract
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_frontend_ux_contract.py
      - name: Test MFA enrollment, login, recovery and session security
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_mfa_account_security.py
      - name: Test password-reset session revocation and platform audit
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_platform_security_audit.py
      - name: Test assisted MFA break-glass recovery controls
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_mfa_break_glass_cli.py
      - name: Test persistent document classification contract
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_document_classifications.py
      - name: Test client profile and multi-matter linkage
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_client_profiles.py
      - name: Test profile migrations and database ownership boundaries
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_profile_initial_schemas.py
      - name: Test separate-runtime routing and firm isolation
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_app_separate_database_runtime.py
