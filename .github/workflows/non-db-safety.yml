name: Non-database safety regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/collect_legal_documents.py"
      - "app.py"
      - "tests/test_trusted_host_middleware.py"
      - "tools/deployment_preflight.py"
      - "tests/test_deployment_preflight.py"
      - "static/index.html"
      - "tests/test_frontend_ux_contract.py"
      - "docs/production_deployment_checklist.md"
      - "tests/test_collection_pipeline.py"
      - "docs/collection_manifest.example.json"
      - "tools/validate_source_permission_register.py"
      - "tests/test_source_permission_register.py"
      - "tools/validate_acquisition_readiness.py"
      - "tests/test_acquisition_readiness_audit.py"
      - "tests/test_acquisition_readiness_cli.py"
      - "tools/validate_legal_release_readiness.py"
      - "tests/test_legal_release_readiness.py"
      - "tools/deadline_calculator.py"
      - "tests/test_deadline_calculator.py"
      - "tools/reminder_schedule.py"
      - "tests/test_reminder_schedule.py"
      - "tests/test_reminder_schedule_cli.py"
      - "tools/reminder_email.py"
      - "tests/test_reminder_email.py"
      - "tools/mfa_primitives.py"
      - "tests/test_mfa_primitives.py"
      - ".github/workflows/non-db-safety.yml"
  push:
    branches: [main]
    paths:
      - "tools/collect_legal_documents.py"
      - "app.py"
      - "tests/test_trusted_host_middleware.py"
      - "tools/deployment_preflight.py"
      - "tests/test_deployment_preflight.py"
      - "static/index.html"
      - "tests/test_frontend_ux_contract.py"
      - "docs/production_deployment_checklist.md"
      - "tests/test_collection_pipeline.py"
      - "docs/collection_manifest.example.json"
      - "tools/validate_source_permission_register.py"
      - "tests/test_source_permission_register.py"
      - "tools/validate_acquisition_readiness.py"
      - "tests/test_acquisition_readiness_audit.py"
      - "tests/test_acquisition_readiness_cli.py"
      - "tools/validate_legal_release_readiness.py"
      - "tests/test_legal_release_readiness.py"
      - "tools/deadline_calculator.py"
      - "tests/test_deadline_calculator.py"
      - "tools/reminder_schedule.py"
      - "tests/test_reminder_schedule.py"
      - "tests/test_reminder_schedule_cli.py"
      - "tools/reminder_email.py"
      - "tests/test_reminder_email.py"
      - "tools/mfa_primitives.py"
      - "tests/test_mfa_primitives.py"
      - ".github/workflows/non-db-safety.yml"

permissions:
  contents: read

jobs:
  non-db-safety:
    name: Non-database legal, deadline, reminder and MFA tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPILOT_ENV: development
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source permission register
        run: python tools/validate_source_permission_register.py

      - name: Test source permission register
        run: python tests/test_source_permission_register.py

      - name: Test acquisition readiness audit
        run: python tests/test_acquisition_readiness_audit.py

      - name: Test acquisition readiness production gate
        run: python tests/test_acquisition_readiness_cli.py

      - name: Test legal release readiness and coverage reporting
        run: python tests/test_legal_release_readiness.py

      - name: Test legal document collection safety
        run: python tests/test_collection_pipeline.py

      - name: Test frontend Arabic/English UX contract
        run: python tests/test_frontend_ux_contract.py

      - name: Test deployment preflight
        run: python tests/test_deployment_preflight.py

      - name: Test runtime Host-header middleware
        run: python tests/test_trusted_host_middleware.py

      - name: Test deadline calculator
        run: python tests/test_deadline_calculator.py

      - name: Test reminder planner
        run: python tests/test_reminder_schedule.py

      - name: Test reminder dry-run CLI
        run: python tests/test_reminder_schedule_cli.py

      - name: Test privacy-safe reminder email adapter
        run: python tests/test_reminder_email.py

      - name: Test MFA cryptographic primitives
        run: python tests/test_mfa_primitives.py

      - name: Generate read-only acquisition readiness report
        run: python tools/validate_acquisition_readiness.py --out "$RUNNER_TEMP/acquisition-readiness.json"

      - name: Generate read-only legal release readiness report
        run: python tools/validate_legal_release_readiness.py --out "$RUNNER_TEMP/legal-release-readiness.json"
