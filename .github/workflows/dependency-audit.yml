name: Dependency security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Audit Python dependency tree
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install audit tool
        run: python -m pip install --upgrade pip==26.2.2 pip-audit==2.10.1
      - name: Audit direct and transitive dependencies
        run: |
          if [ -f requirements-py312.lock ]; then
            echo "Auditing the hash-locked Python 3.12 deployment set."
            pip-audit --strict --progress-spinner off -r requirements-py312.lock
          else
            echo "Deployment lock not checked in yet; auditing the resolved requirements input."
            pip-audit --strict --progress-spinner off -r requirements.txt
          fi
