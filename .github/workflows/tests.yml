name: Tests

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main, 'pilot/**']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COPILOT_ENV: development
      # Synthetic corpus fixtures attest as the dedicated test-only reviewer ID.
      LEGAL_QUALIFIED_EGYPTIAN_COUNSEL_USER_IDS: "42"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install hash-locked dependencies
        id: install_locked_dependencies
        run: python -m pip install --require-hashes -r requirements-py312.lock
      - name: Test document extraction review workflow contract
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_document_review_workflow.py
      - name: Test conservative document intelligence helpers
        if: ${{ !cancelled() && steps.install_locked_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python tests/test_document_intelligence.py
