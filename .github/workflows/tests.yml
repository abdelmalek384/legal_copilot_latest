name: Tests

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test frontend UX and accessibility contract
        run: python tests/test_frontend_ux_contract.py
      - name: Test research inspector status, citation, and memo helpers
        run: python tests/test_research_inspector.py
      - name: Check frontend JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; html=Path('static/index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script[^>]*>(.*?)</script>', html, re.S); assert scripts, 'No inline JavaScript found'; Path('/tmp/legal-copilot.js').write_text(chr(10).join(scripts), encoding='utf-8')"
          node --check /tmp/legal-copilot.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test versioned database migrations
        run: PYTHONPATH=. python tests/test_db_migrations.py
      - name: Test profile-aware migration binding
        run: PYTHONPATH=. python tests/test_schema_profiles.py
      - name: Test initial isolated database profile schemas
        run: PYTHONPATH=. python tests/test_profile_initial_schemas.py
      - name: Test profile-separated runtime and firm isolation
        run: PYTHONPATH=. python tests/test_database_runtime.py
      - name: Test migration history ordering guard
        run: PYTHONPATH=. python tests/test_migration_history_ordering.py
      - name: Test read-only startup DDL inventory
        run: PYTHONPATH=. python tests/test_database_startup_ddl_inventory.py
      - name: Test disposable-copy migration rehearsal
        run: PYTHONPATH=. python tests/test_database_migration_rehearsal.py
      - name: Test fresh database startup and restart
        run: PYTHONPATH=. python tests/test_database_fresh_install_schema.py
      - name: Test read-only FTS consistency preflight
        run: PYTHONPATH=. python tests/test_chunks_fts_preflight.py
      - name: Test staged-copy FTS rebuild safety
        run: PYTHONPATH=. python tests/test_rebuild_chunks_fts_copy.py
      - name: Test SEC-01 runtime route and schema inventory
        run: PYTHONPATH=. python tests/test_security_surface_inventory.py
      - name: Test encrypted restore safety
        run: PYTHONPATH=. python tests/test_backup_restore_safety.py
      - name: Test read-only tenant database preflight
        run: PYTHONPATH=. python tests/test_tenant_database_preflight.py
      - name: Test tenant catalog provisioning and path safety
        run: PYTHONPATH=. python tests/test_tenant_catalog.py
      - name: Test tenant ownership and orphan preflight
        run: PYTHONPATH=. python tests/test_tenant_ownership_preflight.py
      - name: Validate legal data registry and evaluation seeds
        run: python tools/validate_legal_data_foundation.py
      - name: Test retrieval and citation evaluation harness
        run: python tests/test_retrieval_evaluation.py
      - name: Smoke-test evaluation report on unreviewed seeds
        run: python tools/evaluate_retrieval_quality.py
      - name: Validate Phase 2 metadata-only instrument inventory
        run: python tools/validate_phase2_document_inventory.py
      - name: Test Phase 2 instrument inventory safeguards
        run: python tests/test_phase2_document_inventory.py
      - name: Test permission outreach tracking guardrails
        run: python tests/test_permission_outreach_tracker.py
      - name: Validate source permission register
        run: python tools/validate_source_permission_register.py
      - name: Test source permission register
        run: python tests/test_source_permission_register.py
      - name: Run collection pipeline tests
        run: python tests/test_collection_pipeline.py
      - name: Test legal versioned registry
        run: python tests/test_legal_versioned_registry.py
      - name: Test read-only legal version comparison
        run: python tests/test_compare_legal_versions.py
      - name: Test legal corpus audit
        run: python tests/test_legal_corpus_audit.py
      - name: Test legal source review queue
        run: python tests/test_legal_source_review_queue.py
      - name: Test legal candidate catalog
        run: python tests/test_legal_candidate_catalog.py
      - name: Validate legal candidate catalog
        run: python tools/seed_legal_candidates.py
      - name: Test amendment relationship validator
        run: python tests/test_amendment_relationship_validator.py
      - name: Audit amendment relationship register
        run: python tools/validate_amendment_relationships.py --out amendment-relationship-audit.json
      - name: Test first official batch manifest
        run: python tests/test_first_official_batch_manifest.py
      - name: Validate collection manifest template
        run: python -c "import json; d=json.load(open('docs/collection_manifest.example.json', encoding='utf-8')); assert isinstance(d.get('documents'), list); assert len(d['documents']) == 4"
      - name: Test deployment preflight
        run: python tests/test_deployment_preflight.py
      - name: Run unit tests
        run: python selftest.py
      - name: Run API tests
        run: python api_test.py
      - name: Run Arabic multi-case scenario tests
        run: python arabic_scenario_test.py
