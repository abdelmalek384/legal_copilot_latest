name: Tests

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COPILOT_ENV: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Test document extraction review workflow contract
        run: PYTHONPATH=. python tests/test_document_review_workflow.py
      - name: Test frontend UX and accessibility contract
        run: python tests/test_frontend_ux_contract.py
      - name: Test legal PDF import bundle integrity
        run: PYTHONPATH=. python tests/test_import_laws_bundle.py
      - name: Test container deployment contract
        run: PYTHONPATH=. python tests/test_container_deployment_contract.py
      - name: Test hash-locked dependency workflow contract
        run: PYTHONPATH=. python tests/test_dependency_lock_workflow_contract.py
      - name: Test Windows first-run launcher contract
        run: PYTHONPATH=. python tests/test_windows_launcher_contract.py
      - name: Test installable PWA shell and offline privacy boundary
        run: PYTHONPATH=. python tests/test_pwa_shell.py
      - name: Test research inspector status, citation, and memo helpers
        run: python tests/test_research_inspector.py
      - name: Check frontend JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; html=Path('static/index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script[^>]*>(.*?)</script>', html, re.S); assert scripts, 'No inline JavaScript found'; Path('/tmp/legal-copilot.js').write_text(chr(10).join(scripts), encoding='utf-8')"
          node --check /tmp/legal-copilot.js
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke-test public PWA HTTP routes and security headers
        run: PYTHONPATH=. python tests/test_pwa_http_routes.py
      - name: Test live deployment HTTP smoke probe
        run: PYTHONPATH=. python tests/test_deployment_http_smoke.py
      - name: Test research prompt injection boundary
        run: PYTHONPATH=. python tests/test_research_prompt_injection_boundary.py
      - name: Test security audit CSV export
        run: PYTHONPATH=. python tests/test_security_audit_export.py
      - name: Test versioned database migrations
        run: PYTHONPATH=. python tests/test_db_migrations.py
      - name: Test profile-aware migration binding
        run: PYTHONPATH=. python tests/test_schema_profiles.py
      - name: Test initial isolated database profile schemas
        run: PYTHONPATH=. python tests/test_profile_initial_schemas.py
      - name: Test profile-separated runtime and firm isolation
        run: PYTHONPATH=. python tests/test_database_runtime.py
      - name: Test application routing across firm and corpus databases
        run: PYTHONPATH=. python tests/test_app_separate_database_runtime.py
      - name: Test encrypted multi-database backup and restore
        run: PYTHONPATH=. python tests/test_database_backup_bundle.py
      - name: Test approved original-file purge and tombstone backup
        run: PYTHONPATH=. python tests/test_purge_approved_original_files.py
      - name: Test isolated database recovery drill
        run: PYTHONPATH=. python tests/test_database_recovery_drill.py
      - name: Test S3/KMS storage preflight
        run: PYTHONPATH=. python tests/test_s3_storage_preflight.py
      - name: Test S3 original-file storage adapter
        run: PYTHONPATH=. python tests/test_s3_original_file_storage.py
      - name: Test restored original-file S3 import
        run: PYTHONPATH=. python tests/test_import_restored_originals_to_s3.py
      - name: Test migration history ordering guard
        run: PYTHONPATH=. python tests/test_migration_history_ordering.py
      - name: Test read-only startup DDL inventory
        run: PYTHONPATH=. python tests/test_database_startup_ddl_inventory.py
      - name: Test disposable-copy migration rehearsal
        run: PYTHONPATH=. python tests/test_database_migration_rehearsal.py
      - name: Test fresh database startup and restart
        run: PYTHONPATH=. python tests/test_database_fresh_install_schema.py
      - name: Test read-only FTS consistency preflight
