name: Tests

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check frontend JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; html=Path('static/index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script[^>]*>(.*?)</script>', html, re.S); assert scripts, 'No inline JavaScript found'; Path('/tmp/legal-copilot.js').write_text(chr(10).join(scripts), encoding='utf-8')"
          node --check /tmp/legal-copilot.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate legal data registry and evaluation seeds
        run: python tools/validate_legal_data_foundation.py
      - name: Validate source permission register
        run: python tools/validate_source_permission_register.py
      - name: Test source permission register
        run: python tests/test_source_permission_register.py
      - name: Run collection pipeline tests
        run: python tests/test_collection_pipeline.py
      - name: Test legal versioned registry
        run: python tests/test_legal_versioned_registry.py
      - name: Test legal corpus audit
        run: python tests/test_legal_corpus_audit.py
      - name: Test legal source review queue
        run: python tests/test_legal_source_review_queue.py
      - name: Test legal candidate catalog
        run: python tests/test_legal_candidate_catalog.py
      - name: Validate legal candidate catalog
        run: python tools/seed_legal_candidates.py
      - name: Test amendment relationship validator
        run: python tests/test_amendment_relationship_validator.py
      - name: Audit amendment relationship register
        run: python tools/validate_amendment_relationships.py --out amendment-relationship-audit.json
      - name: Test first official batch manifest
        run: python tests/test_first_official_batch_manifest.py
      - name: Validate collection manifest template
        run: python -c "import json; d=json.load(open('docs/collection_manifest.example.json', encoding='utf-8')); assert isinstance(d.get('documents'), list); assert len(d['documents']) == 4"
      - name: Run unit tests
        run: python selftest.py
      - name: Run API tests
        run: python api_test.py
      - name: Run Arabic multi-case scenario tests
        run: python arabic_scenario_test.py
