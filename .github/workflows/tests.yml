name: Tests

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate legal data registry and evaluation seeds
        run: python tools/validate_legal_data_foundation.py
      - name: Run collection pipeline tests
        run: python -m unittest tests/test_collection_pipeline.py
      - name: Validate collection manifest template
        run: python -c "import json; d=json.load(open('docs/collection_manifest.example.json', encoding='utf-8')); assert isinstance(d.get('documents'), list); assert d['documents'] == []"
      - name: Run unit tests
        run: python selftest.py
      - name: Run API tests
        run: python api_test.py
      - name: Run Arabic multi-case scenario tests
        run: python arabic_scenario_test.py
