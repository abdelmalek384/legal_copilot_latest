name: Resolve Python 3.12 deployment lock

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-py312.lock"
      - ".github/workflows/resolve-deployment-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without persisting write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install resolver
        run: python -m pip install --upgrade pip pip-tools
      - name: Resolve pinned transitive dependencies with artifact hashes
        run: |
          pip-compile --resolver=backtracking --generate-hashes --strip-extras --allow-unsafe --output-file=requirements-py312.lock requirements.txt
      - name: Validate clean hash-locked installation
        run: |
          python -m venv /tmp/legal-copilot-lock-check
          /tmp/legal-copilot-lock-check/bin/python -m pip install --upgrade pip
          /tmp/legal-copilot-lock-check/bin/python -m pip install --require-hashes -r requirements-py312.lock
      - name: Audit the exact hash-locked dependency set
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit --strict --progress-spinner off -r requirements-py312.lock
      - name: Upload resolved deployment lock
        uses: actions/upload-artifact@v4
        with:
          name: requirements-py312-lock
          path: requirements-py312.lock
          if-no-files-found: error
          retention-days: 7

  commit-lock:
    name: Commit generated lock to same-repository PR branch
    permissions:
      contents: write
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download generated lock
        uses: actions/download-artifact@v4
        with:
          name: requirements-py312-lock
      - name: Commit only the generated lockfile
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-py312.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "Add Python 3.12 hash-locked deployment dependencies"
            git push origin "HEAD:${HEAD_REF}"
          fi
