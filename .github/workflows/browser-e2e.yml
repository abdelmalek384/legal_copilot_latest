name: Browser acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COPILOT_ENV: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - name: Install application and pinned browser-test dependencies
        run: python -m pip install -r requirements.txt -r requirements-browser.txt

      - name: Install pinned Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Run real-browser acceptance suite against synthetic disposable data
        run: python -m unittest -v tests.browser.test_acceptance

      - name: Upload sanitized failure screenshots only
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-acceptance-failure-screenshots
          path: artifacts/browser/*.png
          if-no-files-found: ignore
          retention-days: 3
